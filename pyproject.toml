[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seismic_survey_design"
version = "0.0.1"
description = "3D Seismic Survey Design tool"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Jüstel", email = "alexander.juestel@ieg.fraunhofer.de" }]
keywords = ["seismic", "survey design", "preplot", "prepermitting", "geospatial"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "numpy>=2.5.4",
    "shapely>=2.2.0",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "pyproj>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17",
    "mypy>=2.4.0",
    "build>=1.6.1",
    "twine>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/AlexanderJuestel/seismic_survey_design"
Repository = "https://github.com/AlexanderJuestel/seismic_survey_design.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["seismic_survey_design*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: Stil- und Formatierungsprobleme
    "F",    # Pyflakes: ungenutzte Imports, undefinierte Namen usw.
    "I",    # isort: Imports sortieren
    "UP",   # pyupgrade: moderne Python-Syntax
    "B",    # flake8-bugbear: häufige Fehlerquellen
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
files = ["seismic_survey_design"]
ignore_missing_imports = true
show_error_codes = true
pretty = true
