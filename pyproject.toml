[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seismic_survey_design"
version = "0.0.1"
description = "3D Seismic Survey Design tool"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alexander Jüstel", email = "alexander.juestel@ieg.fraunhofer.de" }]
keywords = ["seismic", "survey design", "preplot", "prepermitting", "geospatial"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "numpy>=1.24",
    "shapely>=2.0",
    "geopandas>=0.13",
    "matplotlib>=3.7",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.17",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/AlexanderJuestel/seismic_survey_design"
Repository = "https://github.com/AlexanderJuestel/seismic_survey_design.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["seismic_survey_design*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: Stil- und Formatierungsprobleme
    "F",    # Pyflakes: ungenutzte Imports, undefinierte Namen usw.
    "I",    # isort: Imports sortieren
    "UP",   # pyupgrade: moderne Python-Syntax
    "B",    # flake8-bugbear: häufige Fehlerquellen
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
files = ["seismic_survey_design"]
ignore_missing_imports = true
show_error_codes = true
pretty = true
