# seismic_survey_design/survey_2d_config.yaml
# Survey design configuration — static, user-defined parameters

survey:
  # Target area definition (georeferenced)
  profile_name: 'Profile Name'               # Name of the profile
  survey_name: 'Seismic Survey'              # Name of the survey 
  project_name: 'Seismic Survey Project'     # Name of the seismic sroject
  target:
    crs: "EPSG:25832"                        # Coordinate Reference System
    center: "/input/center.shp"              # Path to shape file with center point of the survey

    # Symmetric length of target zone
    l: 4000.0                                # [m] # Length of the target zone 
    # Asymmetric length of target zone
    l_ratio: 0.33                            # [ ] # Ratio of the length of the target zone before and after the center point
    # Manually set length of target zone
    l1: 2500                                 # [m] # Manually set target zone length before the center point
    l2: 4000                                 # [m] # Manually set target zone legnth after the center point

    rotation_deg: 20                         # [°] # Rotation of profile (0° = N-S)
    dip: 30                                  # [°] # Maximum dip of layers in profile direction
    target_depth: 3050                       # [m] # Depth of the target horizon

    # Manually set length of the migration aperture
    m1: 2783                                 # [m] # Manually set migration aperture before the target zone
    m2: 1761                                 # [m] # Manually set migration aperture after the target zone
    # Manually set length of the fold taper
    ft1: 1601                                # [m] # Manually set fold taper before the migration aperture
    ft2: 1601                                # [m] # Manually set fold taper after the migration aperture

    si: 500                                  # [m] # Source spacing 
    ri: 250                                  # [m] # Receiver spacing
    bin_size: 100                            # [m] # Bin size
    max_offset: 20000                        # [m] # Maximum offset

  